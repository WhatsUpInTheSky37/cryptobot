[project]
name = "cryptobot"
version = "0.5.2"
description = "Budget-capped automated crypto trading desktop app with TEST and BUY modes"
requires-python = ">=3.12"
dependencies = [
  "ccxt>=4.4",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
  "SQLAlchemy>=2.0",
  "pydantic>=2.7",
  "numpy>=1.26",
  "keyring>=25",
  "platformdirs>=4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6"]
build = ["pyinstaller>=6.6"]

[project.scripts]
cryptobot = "cryptobot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryptobot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
