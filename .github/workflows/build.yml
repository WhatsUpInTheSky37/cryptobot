name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: QT_QPA_PLATFORM=offscreen pytest -q
  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build macOS app and dmg
        run: |
          set +e
          ./scripts/build_mac.sh > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -n 80 build.log | while IFS= read -r line; do echo "::error title=mac build::${line}"; done
            exit $rc
          fi
          tail -n 5 build.log
      - uses: actions/upload-artifact@v4
        with: { name: CryptoBot-macOS, path: dist/CryptoBot.dmg }
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $failed = $false
          try {
            .\scripts\build_windows.ps1 2>&1 | Tee-Object -FilePath build.log | Out-Null
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          } catch {
            $_ | Out-String | Out-File -Append build.log
            $failed = $true
          }
          if ($failed) {
            Get-Content build.log -Tail 80 | ForEach-Object { Write-Output "::error title=windows build::$_" }
            exit 1
          }
          Get-Content build.log -Tail 5
      - uses: actions/upload-artifact@v4
        with: { name: CryptoBot-Windows, path: dist/CryptoBot-Setup-*.exe }
